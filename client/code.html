<!-- Interactive JavaScript Logic -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Initialize Icons
      lucide.createIcons();

      // 2. Constants & Mode definitions
      const MODES = {
        work: {
          duration: 25 * 60, // 1500 seconds
          title: 'DEEP FOCUS',
          strokeClass: 'stroke-amber-400',
          textClass: 'text-amber-300',
          glowClass: 'bg-amber-500/20',
          quote: '"Flow with the rain, one breath at a time."'
        },
        short: {
          duration: 5 * 60, // 300 seconds
          title: 'SHORT BREAK',
          strokeClass: 'stroke-sky-400',
          textClass: 'text-sky-300',
          glowClass: 'bg-sky-500/20',
          quote: '"Hydrate, stretch, and let your eyes rest."'
        }
      };

      // Progress Ring Circumference: 2 * Math.PI * 104 = ~653.451
      const RADIUS = 104;
      const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

      // Persist today's completed focus time without requiring an account.
      function getTodayFocusStorageKey() {
        const today = new Date();
        const date = [
          today.getFullYear(),
          String(today.getMonth() + 1).padStart(2, '0'),
          String(today.getDate()).padStart(2, '0')
        ].join('-');
        return `auradesk-focus-minutes-${date}`;
      }

      function loadTodayFocusMinutes(storageKey) {
        try {
          const storedMinutes = Number(window.localStorage.getItem(storageKey));
          return Number.isInteger(storedMinutes) && storedMinutes >= 0 ? storedMinutes : 0;
        } catch (e) {
          return 0;
        }
      }

      function saveTodayFocusMinutes(minutes, storageKey) {
        try {
          window.localStorage.setItem(storageKey, String(minutes));
        } catch (e) {
          console.warn('Could not save today’s focus time:', e);
        }
      }

      // State
      let currentMode = 'work';
      let totalSeconds = MODES[currentMode].duration;
      let remainingSeconds = totalSeconds;
      let timerInterval = null;
      let timerDeadline = null;
      let isRunning = false;
      let currentRound = 1;
      let totalRounds = 4;
      let focusStorageKey = getTodayFocusStorageKey();
      let totalFocusedMinutes = loadTodayFocusMinutes(focusStorageKey);

      // DOM Elements
      const timerDisplay = document.getElementById('timer-display');
      const progressRing = document.getElementById('progress-ring');
      const playPauseBtn = document.getElementById('play-pause-btn');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      const resetBtn = document.getElementById('reset-btn');
      const skipBtn = document.getElementById('skip-btn');
      const tabWork = document.getElementById('tab-work');
      const tabShort = document.getElementById('tab-short');
      const sessionTag = document.getElementById('session-tag');
      const roundIndicator = document.getElementById('round-indicator');
      const motivationalQuote = document.getElementById('motivational-quote');
      const totalFocusTimeEl = document.getElementById('total-focus-time');
      const focusDateLabelEl = document.getElementById('focus-date-label');
      const mainCard = document.getElementById('main-card');
      const ambientGlow = document.getElementById('ambient-glow');
      const headerPulsePing = document.getElementById('header-pulse-ping');
      function renderFocusDateLabel() {
        focusDateLabelEl.textContent = new Date().toLocaleDateString(undefined, {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
      }

      renderFocusDateLabel();
      totalFocusTimeEl.textContent = `${totalFocusedMinutes}m`;

      function syncTodayFocusMinutes() {
        const currentStorageKey = getTodayFocusStorageKey();
        if (currentStorageKey === focusStorageKey) return;

        focusStorageKey = currentStorageKey;
        totalFocusedMinutes = loadTodayFocusMinutes(focusStorageKey);
        renderFocusDateLabel();
        totalFocusTimeEl.textContent = `${totalFocusedMinutes}m`;
      }

      setInterval(syncTodayFocusMinutes, 60_000);

      // Setup Ring Stroke
      progressRing.style.strokeDasharray = `${CIRCUMFERENCE}`;
      progressRing.style.strokeDashoffset = '0';

      // 3. Audio Notification System (Web Audio API Synthesizer)
      let sharedAudioCtx = null;
      function getAudioContext() {
        if (!sharedAudioCtx) {
          sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (sharedAudioCtx.state === 'suspended') {
          sharedAudioCtx.resume();
        }
        return sharedAudioCtx;
      }

      function playNotificationChime() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          
          // Gentle melodic bell chord (E5, G#5, B5)
          const notes = [659.25, 830.61, 987.77];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);

            // Envelope
            gain.gain.setValueAtTime(0, now + idx * 0.12);
            gain.gain.linearRampToValueAtTime(0.18, now + idx * 0.12 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.12 + 1.8);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 1.85);
          });
        } catch (e) {
          console.warn('Web Audio error:', e);
        }
      }

      // 4. Timer Rendering Logic
      function renderTime() {
        syncTodayFocusMinutes();
        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        
        timerDisplay.textContent = formatted;
        document.title = `${formatted} · Focus Space`;

        // SVG Ring calculation: offset goes from 0 (full) to CIRCUMFERENCE (empty)
        // fraction remaining = remainingSeconds / totalSeconds
        const fractionRemaining = remainingSeconds / totalSeconds;
        const offset = CIRCUMFERENCE * (1 - fractionRemaining);
        progressRing.style.strokeDashoffset = offset;
      }

      function updatePlayStateUI(running) {
        if (running) {
          playIcon.classList.add('hidden');
          pauseIcon.classList.remove('hidden');
          mainCard.classList.add('timer-running');
          headerPulsePing.classList.remove('hidden');
          playPauseBtn.setAttribute('title', 'Pause Focus Session (Space)');
        } else {
          playIcon.classList.remove('hidden');
          pauseIcon.classList.add('hidden');
          mainCard.classList.remove('timer-running');
          headerPulsePing.classList.add('hidden');
          playPauseBtn.setAttribute('title', 'Start Focus Session (Space)');
        }
      }

      function startCountdown() {
        if (isRunning || remainingSeconds <= 0) return;
        try {
          getAudioContext(); // Pre-warm audio on user interaction
        } catch (e) {
          console.warn('Web Audio is unavailable:', e);
        }
        isRunning = true;
        timerDeadline = Date.now() + remainingSeconds * 1000;
        updatePlayStateUI(true);

        timerInterval = setInterval(() => {
          const nextRemaining = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
          if (nextRemaining !== remainingSeconds) {
            remainingSeconds = nextRemaining;
            renderTime();
          }
          if (remainingSeconds === 0) {
            handleTimerComplete();
          }
        }, 250);
      }

      function pauseCountdown() {
        let didExpire = false;
        if (isRunning && timerDeadline !== null) {
          remainingSeconds = Math.max(0, Math.ceil((timerDeadline - Date.now()) / 1000));
          didExpire = remainingSeconds === 0;
          renderTime();
        }
        clearInterval(timerInterval);
        timerInterval = null;
        timerDeadline = null;
        isRunning = false;
        updatePlayStateUI(false);
        return didExpire;
      }

      function toggleTimer() {
        if (isRunning) {
          if (pauseCountdown()) handleTimerComplete();
        } else {
          startCountdown();
        }
      }

      function resetTimer() {
        if (pauseCountdown()) handleTimerComplete();
        remainingSeconds = totalSeconds;
        renderTime();
      }

      function handleTimerComplete() {
        pauseCountdown();
        playNotificationChime();

        if (currentMode === 'work') {
          totalFocusedMinutes += MODES.work.duration / 60;
          totalFocusTimeEl.textContent = `${totalFocusedMinutes}m`;
          saveTodayFocusMinutes(totalFocusedMinutes, focusStorageKey);
          
          if (currentRound < totalRounds) {
            currentRound++;
          } else {
            currentRound = 1;
          }
          roundIndicator.textContent = `ROUND ${currentRound}/${totalRounds}`;
        }
      }

      function switchMode(newMode) {
        if (pauseCountdown()) handleTimerComplete();
        currentMode = newMode;
        totalSeconds = MODES[newMode].duration;
        remainingSeconds = totalSeconds;

        const config = MODES[newMode];

        // Tab styling active/inactive states
        if (newMode === 'work') {
          tabWork.className = "px-4 py-1.5 rounded-full text-xs font-medium transition-all duration-200 flex items-center space-x-1.5 bg-white/15 text-white shadow-sm border border-white/10";
          tabShort.className = "px-4 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-zinc-200 transition-all duration-200 flex items-center space-x-1.5 border border-transparent";
          tabWork.setAttribute('aria-pressed', 'true');
          tabShort.setAttribute('aria-pressed', 'false');
          tabWork.querySelector('[data-lucide]').classList.add('text-amber-400');
          tabShort.querySelector('[data-lucide]').classList.remove('text-sky-400');
          progressRing.classList.remove('stroke-sky-400');
          progressRing.classList.add('stroke-amber-400');
          sessionTag.className = "text-amber-300 font-semibold tracking-wider";
          ambientGlow.className = "absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-20 bg-amber-500/20 blur-3xl pointer-events-none rounded-full transition-all duration-700";
        } else {
          tabShort.className = "px-4 py-1.5 rounded-full text-xs font-medium transition-all duration-200 flex items-center space-x-1.5 bg-white/15 text-white shadow-sm border border-white/10";
          tabWork.className = "px-4 py-1.5 rounded-full text-xs font-medium text-zinc-400 hover:text-zinc-200 transition-all duration-200 flex items-center space-x-1.5 border border-transparent";
          tabWork.setAttribute('aria-pressed', 'false');
          tabShort.setAttribute('aria-pressed', 'true');
          tabWork.querySelector('[data-lucide]').classList.remove('text-amber-400');
          tabShort.querySelector('[data-lucide]').classList.add('text-sky-400');
          progressRing.classList.remove('stroke-amber-400');
          progressRing.classList.add('stroke-sky-400');
          sessionTag.className = "text-sky-300 font-semibold tracking-wider";
          ambientGlow.className = "absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-20 bg-sky-500/20 blur-3xl pointer-events-none rounded-full transition-all duration-700";
        }

        sessionTag.textContent = config.title;
        motivationalQuote.textContent = config.quote;
        renderTime();
      }

      function skipSession() {
        if (pauseCountdown()) {
          handleTimerComplete();
          switchMode(currentMode === 'work' ? 'short' : 'work');
          return;
        }
        if (currentMode === 'work') {
          if (currentRound < totalRounds) {
            currentRound++;
          } else {
            currentRound = 1;
          }
          roundIndicator.textContent = `ROUND ${currentRound}/${totalRounds}`;
          switchMode('short');
        } else {
          switchMode('work');
        }
      }

      // Event Listeners for Controls
      playPauseBtn.addEventListener('click', toggleTimer);
      resetBtn.addEventListener('click', resetTimer);
      skipBtn.addEventListener('click', skipSession);

      tabWork.addEventListener('click', () => switchMode('work'));
      tabShort.addEventListener('click', () => switchMode('short'));

      const quickWorkBtn = document.getElementById('quick-work-btn');
      const quickBreakBtn = document.getElementById('quick-break-btn');
      if (quickWorkBtn) quickWorkBtn.addEventListener('click', () => switchMode('work'));
      if (quickBreakBtn) quickBreakBtn.addEventListener('click', () => switchMode('short'));

      // Keyboard shortcuts: Space to toggle, R to reset, S to skip
      window.addEventListener('keydown', (e) => {
        const target = e.target;
        const isTextEntry = target && (
          target.isContentEditable ||
          ['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)
        );
        if (e.defaultPrevented || e.repeat || e.ctrlKey || e.metaKey || e.altKey || isTextEntry) return;

        if (e.code === 'Space') {
          e.preventDefault();
          toggleTimer();
        } else if (e.code === 'KeyR') {
          resetTimer();
        } else if (e.code === 'KeyS') {
          skipSession();
        }
      });

      // 5. Rain Sounds Spotify Playlist
      const rainToggleBtn = document.getElementById('rain-toggle-btn');
      const rainBadge = document.getElementById('rain-badge');
      const rainPlaylistPanel = document.getElementById('rain-playlist-panel');
      const rainCloseBtn = document.getElementById('rain-close-btn');

      function setRainPlaylistOpen(isOpen) {
        rainPlaylistPanel.classList.toggle('hidden', !isOpen);
        rainToggleBtn.setAttribute('aria-expanded', String(isOpen));
        rainToggleBtn.classList.toggle('bg-white/20', isOpen);
        rainToggleBtn.classList.toggle('text-amber-300', isOpen);
        rainBadge.classList.toggle('hidden', !isOpen);
      }

      rainToggleBtn.addEventListener('click', () => {
        setRainPlaylistOpen(rainPlaylistPanel.classList.contains('hidden'));
      });
      rainCloseBtn.addEventListener('click', () => setRainPlaylistOpen(false));
      rainPlaylistPanel.addEventListener('click', (event) => {
        if (event.target === rainPlaylistPanel) setRainPlaylistOpen(false);
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !rainPlaylistPanel.classList.contains('hidden')) {
          setRainPlaylistOpen(false);
        }
      });

      // 6. Spotify Search and Embed Selection
      const spotifyPickerPanel = document.getElementById('spotify-picker-panel');
      const spotifyChooseBtn = document.getElementById('spotify-choose-btn');
      const spotifyPickerClose = document.getElementById('spotify-picker-close');
      const spotifySearchForm = document.getElementById('spotify-search-form');
      const spotifySearchQuery = document.getElementById('spotify-search-query');
      const spotifyLoadForm = document.getElementById('spotify-load-form');
      const spotifyContentLink = document.getElementById('spotify-content-link');
      const spotifyPickerStatus = document.getElementById('spotify-picker-status');
      const spotifyIframe = document.getElementById('spotify-iframe');

      function setSpotifyPickerOpen(isOpen) {
        spotifyPickerPanel.classList.toggle('hidden', !isOpen);
      }

      function parseSpotifyContent(value) {
        const input = value.trim();
        const uriMatch = input.match(/^spotify:(track|playlist|album):([A-Za-z0-9]+)$/i);
        if (uriMatch) return { type: uriMatch[1].toLowerCase(), id: uriMatch[2] };

        try {
          const url = new URL(input);
          if (!['open.spotify.com', 'www.open.spotify.com'].includes(url.hostname.toLowerCase())) return null;
          const parts = url.pathname.split('/').filter(Boolean);
          const typeIndex = parts.findIndex((part) => ['track', 'playlist', 'album'].includes(part.toLowerCase()));
          if (typeIndex < 0 || !parts[typeIndex + 1]) return null;
          const type = parts[typeIndex].toLowerCase();
          const id = parts[typeIndex + 1];
          return /^[A-Za-z0-9]+$/.test(id) ? { type, id } : null;
        } catch (e) {
          return null;
        }
      }

      function setSpotifyContent(content, persist = false) {
        spotifyIframe.src = `https://open.spotify.com/embed/${content.type}/${content.id}?utm_source=generator&theme=0`;
        spotifyIframe.title = `Spotify ${content.type} player`;
        if (persist) {
          try {
            window.localStorage.setItem('auradesk-spotify-selection', `spotify:${content.type}:${content.id}`);
          } catch (e) {
            console.warn('Could not save the Spotify selection:', e);
          }
        }
      }

      try {
        const savedSpotifyContent = parseSpotifyContent(window.localStorage.getItem('auradesk-spotify-selection') || '');
        if (savedSpotifyContent) setSpotifyContent(savedSpotifyContent);
      } catch (e) {
        // Keep the default playlist when local storage is unavailable.
      }

      spotifyChooseBtn.addEventListener('click', () => setSpotifyPickerOpen(true));
      spotifyPickerClose.addEventListener('click', () => setSpotifyPickerOpen(false));
      spotifyPickerPanel.addEventListener('click', (event) => {
        if (event.target === spotifyPickerPanel) setSpotifyPickerOpen(false);
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !spotifyPickerPanel.classList.contains('hidden')) {
          setSpotifyPickerOpen(false);
        }
      });
      spotifySearchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const query = spotifySearchQuery.value.trim();
        if (!query) return;
        window.open(`https://open.spotify.com/search/${encodeURIComponent(query)}`, '_blank', 'noopener,noreferrer');
      });
      spotifyLoadForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const content = parseSpotifyContent(spotifyContentLink.value);
        if (!content) {
          spotifyPickerStatus.textContent = 'Enter a valid Spotify track, playlist, or album link.';
          spotifyPickerStatus.classList.add('text-rose-300');
          return;
        }

        setSpotifyContent(content, true);
        spotifyPickerStatus.textContent = 'Spotify player updated.';
        spotifyPickerStatus.classList.remove('text-rose-300');
        setSpotifyPickerOpen(false);
      });

      // 7. Spotify Collapse / Expand
      let spotifyExpanded = true;
      const spotifyCollapseBtn = document.getElementById('spotify-collapse-btn');
      const spotifyChevron = document.getElementById('spotify-chevron');
      const spotifyWrapper = document.getElementById('spotify-wrapper');
      const focusTracker = document.getElementById('focus-tracker');

      spotifyCollapseBtn.addEventListener('click', () => {
        spotifyExpanded = !spotifyExpanded;
        if (spotifyExpanded) {
          spotifyWrapper.style.maxHeight = '152px';
          spotifyWrapper.style.opacity = '1';
          spotifyWrapper.style.marginTop = '0px';
          spotifyChevron.style.transform = 'rotate(0deg)';
          focusTracker.classList.remove('bottom-20');
          focusTracker.classList.add('bottom-[15rem]');
        } else {
          spotifyWrapper.style.maxHeight = '0px';
          spotifyWrapper.style.opacity = '0';
          spotifyWrapper.style.marginTop = '-6px';
          spotifyChevron.style.transform = 'rotate(180deg)';
          focusTracker.classList.remove('bottom-[15rem]');
          focusTracker.classList.add('bottom-20');
        }
      });

      // 8. Zen Mode Toggle
      let isZen = false;
      const zenBtn = document.getElementById('zen-btn');
      const footerSection = document.getElementById('footer-section');

      zenBtn.addEventListener('click', () => {
        isZen = !isZen;
        if (isZen) {
          footerSection.classList.add('opacity-10', 'pointer-events-none');
          zenBtn.classList.add('text-amber-300', 'bg-white/20');
        } else {
          footerSection.classList.remove('opacity-10', 'pointer-events-none');
          zenBtn.classList.remove('text-amber-300', 'bg-white/20');
        }
      });

      // 9. Info Modal
      document.getElementById('info-btn').addEventListener('click', () => {
        alert("✨ Focus Space Pomodoro\n\n• Work Session: 25 mins\n• Short Break: 5 mins\n• Controls: [Space] Start/Pause, [R] Reset, [S] Skip\n• Rain Icon: Spotify rain sounds playlist\n• Spotify: Search Spotify and load a track or playlist link");
      });

      // Initial visual render
      renderTime();
    });
  </script>
</body></html>
